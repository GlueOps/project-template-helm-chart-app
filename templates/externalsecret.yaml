{{- if .Values.externalSecret.enabled  }}
{{- range $nameSuffix, $data := .Values.externalSecret.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" $ }}-{{ $nameSuffix }}
  namespace: {{ include "app.namespace" $ }}
  labels:
    {{- include "chart.commonLabels" $ | indent 4 }}
  annotations:
    {{- include "chart.commonAnnotations" $ | indent 4 }}
spec:
  refreshInterval: {{ $data.refreshInterval | default $.Values.externalSecret.refreshInterval }}
  {{- /*
  Use hasKey, not truthiness: empty map/list values (data: {}, dataFrom: {}) are falsey in Go
  templates and would otherwise short-circuit this guard, hiding the more specific
  "data.* is required" / "dataFrom.key is required" errors below.
  */ -}}
  {{- if and (not (hasKey $data "data")) (not (hasKey $data "dataFrom")) }}
  {{- fail (printf "data or dataFrom not specified for secret %s-%s" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  {{- if hasKey $data "data" }}
  {{- if not (kindIs "map" $data.data) }}
  {{- fail (printf "data must be a map for secret %s-%s, got %s" (include "app.name" $) $nameSuffix (kindOf $data.data)) }}
  {{- end }}
  {{- if eq (len $data.data) 0 }}
  {{- fail (printf "data must contain at least one entry for secret %s-%s (got an empty map); remove the `data:` key entirely or add at least one secretKey" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  data:
  {{- range $secretKey, $secretProperty := $data.data}}
    {{- if not (kindIs "map" $secretProperty) }}
    {{- fail (printf "data entry for secretKey %s in secret %s-%s must be a map, not a scalar — did you accidentally set it to a plain string?" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- if not (hasKey $secretProperty "remoteRef") }}
    {{- fail (printf "remoteRef is required for secretKey %s in secret %s-%s" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- if not (kindIs "map" $secretProperty.remoteRef) }}
    {{- fail (printf "remoteRef must be a map for secretKey %s in secret %s-%s" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- if not (hasKey $secretProperty.remoteRef "key") }}
    {{- fail (printf "remoteRef.key is required for secretKey %s in secret %s-%s" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- $remoteRefKeyRaw := get $secretProperty.remoteRef "key" }}
    {{- if not (kindIs "string" $remoteRefKeyRaw) }}
    {{- fail (printf "remoteRef.key must be a string for secretKey %s in secret %s-%s" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- $remoteRefKey := ($remoteRefKeyRaw | trim) }}
    {{- if eq $remoteRefKey "" }}
    {{- fail (printf "remoteRef.key must be non-empty for secretKey %s in secret %s-%s" $secretKey (include "app.name" $) $nameSuffix) }}
    {{- end }}
    {{- $sanitizedRemoteRef := merge (dict "key" $remoteRefKey) (omit $secretProperty.remoteRef "key") }}
    {{/*
    Pass-through: fields other than `key` (property, version, decodingStrategy,
    metadataPolicy, conversionStrategy, ...) are forwarded verbatim to ESO,
    which is the authority on the remoteRef schema. We deliberately do not
    type-check them here so this template stays compatible with new ESO fields
    without a chart bump. ESO will reject malformed values server-side.
    */}}
    - secretKey: {{ $secretKey }}
      remoteRef:
        {{- toYaml $sanitizedRemoteRef | nindent 8 }}
  {{- end }}
  {{- end }}
  {{- if hasKey $data "dataFrom" }}
  {{- if not (kindIs "map" $data.dataFrom) }}
  {{- fail (printf "dataFrom must be a map for secret %s-%s" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  {{- if not (hasKey $data.dataFrom "key") }}
  {{- fail (printf "dataFrom.key is required for secret %s-%s" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  {{- $dataFromKeyRaw := get $data.dataFrom "key" }}
  {{- if not (kindIs "string" $dataFromKeyRaw) }}
  {{- fail (printf "dataFrom.key must be a string for secret %s-%s" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  {{- $dataFromKey := ($dataFromKeyRaw | trim) }}
  {{- if eq $dataFromKey "" }}
  {{- fail (printf "dataFrom.key must be non-empty for secret %s-%s" (include "app.name" $) $nameSuffix) }}
  {{- end }}
  {{- $sanitizedDataFrom := merge (dict "key" $dataFromKey) (omit $data.dataFrom "key") }}
  {{/*
  Pass-through (mirrors the remoteRef pattern above): fields other than `key`
  (property, version, decodingStrategy, conversionStrategy, ...) are forwarded
  verbatim to ESO, which is the authority on the dataFrom.extract schema. We
  deliberately do not type-check them here so this template stays compatible
  with new ESO fields without a chart bump. ESO will reject malformed values
  server-side.
  */}}
  dataFrom:
    - extract:
        {{- toYaml $sanitizedDataFrom | nindent 8 }}
  {{- end }}
  {{- if $data.secretStore }}
  secretStoreRef:
    name: {{ $data.secretStore.name }}
    kind: {{ $data.secretStore.kind | default "ClusterSecretStore" }}
  {{- else }}
  secretStoreRef:
    name: {{ $.Values.externalSecret.secretStore.name }}
    kind: {{ $.Values.externalSecret.secretStore.kind | default "ClusterSecretStore" }}
  {{- end }}
  target:
    name: {{ $data.name | default (printf "%s-%s" (include "app.name" $) $nameSuffix) }}
    template:
      type: {{ $data.type | default "Opaque" }}
      {{- if or $data.annotations $data.labels}}
      metadata:
        {{- if $data.annotations }}
        annotations: {{ toYaml $data.annotations | nindent 10 }}
        {{- end }}
        {{- if $data.labels }}
        labels: {{ toYaml $data.labels | nindent 10 }}
        {{- end }}
      {{- end }}

{{- end}}
{{- end}}
