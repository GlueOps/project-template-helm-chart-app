suite: Deployment

templates:
  - templates/deployment.yaml
set:
  appName: "example-app"

tests:
  - it: does not fail to render when image tag not given
    set:
      deployment:
        enabled: true
        image: example-image:v1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-image:v1

  - it: uses image tag when given
    set:
      appVersion: 1.2.3
      image:
        repository: example-image
        tag: example-tag
      deployment:
        enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: 'example-image:example-tag$'
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: 1.2.3

  - it: should pass all kinds of assertion
    set:
      appName: unittest
      image:
        repository: nginx
        tag: 1.1.2
        port: 9999
      deployment:
        enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 100m
            memory: 200Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "unittest")].image
          value: docker.io/nginx:1.1.2
      - notEqual:
          path: spec.template.spec.containers[?(@.name == "unittest")].image
          value: nginx:latest
      - equal:
          path: spec.template.spec.containers[?(@.name == "unittest")].ports[0].containerPort
          value: 9999
      - notEqual:
          path: spec.template.spec.containers[?(@.name == "unittest")].ports[0].containerPort
          value: 8080
      - notExists:
          path: spec.template.nodeSelector
      - notExists:
          path: spec.template.spec.containers[1]
      - exists:
          path: spec.template
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[?(@.name == "unittest")]
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[?(@.name == "unittest")].resources.limits
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[?(@.name == "unittest")].resources.requests
      - isKind:
          of: Deployment

  - it: should use the correct image
    set:
      deployment.enabled: true
      image.registry: docker.io
      image.repository: nginx
      image.tag: 1.0.0
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker.io/nginx:1.0.0$'

  - it: should use the correct port
    set:
      image.port: 9999
      deployment.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9999

  - it: should use the correct deployment strategy
    set:
      deployment.enabled: true
      deployment.replicas: 1
      deployment.strategy: RollingUpdate
      deployment.securityContext.fsGroup: 2000
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: should have correct liveness and readiness probes
    set:
      deployment.enabled: true
      deployment.livenessProbe.httpGet.path: /health
      deployment.livenessProbe.initialDelaySeconds: 10
      deployment.livenessProbe.periodSeconds: 10
      deployment.livenessProbe.timeoutSeconds: 5
      deployment.livenessProbe.failureThreshold: 5
      deployment.livenessProbe.successThreshold: 1
      deployment.readinessProbe.httpGet.path: /health
      deployment.readinessProbe.initialDelaySeconds: 10
      deployment.readinessProbe.periodSeconds: 10
      deployment.readinessProbe.timeoutSeconds: 1
      deployment.readinessProbe.failureThreshold: 3
      deployment.readinessProbe.successThreshold: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.successThreshold
          value: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 1

  - it: should include the correct environment variables
    set:
      deployment.enabled: true
      deployment.envVariables:
        - name: FOO
          value: "bar"
        - name: BUZZ
          value: "fizz"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: "bar"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ
            value: "fizz"

  - it: should set up the liveness probe correctly
    set:
      deployment.enabled: true
      deployment.livenessProbe:
        httpGet:
          path: /health
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
        successThreshold: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.successThreshold
          value: 1

  # Test case for optional initContainers
  - it: should set initContainers if provided
    set:
      deployment.enabled: true
      deployment.initContainers:
        - name: init-mydb
          image: busybox:1.28
          command: ['sh', '-c', "until nslookup mydb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done"]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-mydb
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.28
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: ['sh', '-c', "until nslookup mydb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done"]

  # Test case for optional hostAliases
  - it: should set hostAliases if provided
    set:
      deployment.enabled: true
      deployment.hostAliases:
        - ip: "127.0.0.1"
          hostnames:
          - "foo.local"
          - "bar.local"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.hostAliases[0].ip
          value: "127.0.0.1"
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: "foo.local"
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[1]
          value: "bar.local"

  # Test case for optional envSecrets
  - it: should set envSecrets if provided
    set:
      deployment:
        enabled: true
        envSecrets:
        - variable: MYSQL_PASSWORD
          secretName: databases-secrets
          secretKey: mysql-password
        - variable: JWT
          secretName: web-tokens
          secretKey: jwt
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: databases-secrets
                key: mysql-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT
            valueFrom:
              secretKeyRef:
                name: web-tokens
                key: jwt

  # Test case for optional envConfigMaps
  - it: should set envConfigMaps if provided
    set:
      deployment.enabled: true
      deployment.envConfigMaps:
        - variable: MYSQL_HOST
          configMapName: mysql-config
          configMapKey: host
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_HOST
            valueFrom:
              configMapKeyRef:
                name: mysql-config
                key: host

  # Test case for optional envMap
  - it: should set envMap if provided
    set:
      deployment:
        enabled: true
        envMap: 
          foo:
            value: bar
          foo1:
            valueFrom:
              configMapKeyRef:
                name: configmap-name
                key: configMapKey
          foo2:
            valueFrom:
              secretKeyRef:
                name: secret-name
                key: secretKey
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: foo
            value: bar
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: foo1
            valueFrom:
              configMapKeyRef:
                name: configmap-name
                key: configMapKey
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: foo2
            valueFrom:
              secretKeyRef:
                name: secret-name
                key: secretKey

  # Test case for optional serviceAccount
  - it: should set serviceAccount if enabled
    set:
      deployment.enabled: true
      deployment.serviceAccount.enabled: true
      deployment.serviceAccount.name: myserviceaccount
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: myserviceaccount

  # Test case for optional nodeSelector
  - it: should set nodeSelector if provided
    set:
      deployment.enabled: true
      deployment.nodeSelector: 
        node-role.kubernetes.io/on-demand: "true"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.nodeSelector
          value: 
            node-role.kubernetes.io/on-demand: "true"

  # Test case for optional tolerations
  - it: should set tolerations if provided
    set:
      deployment.enabled: true
      deployment.tolerations:
        - key: "node-role.kubernetes.io/on-demand"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: "node-role.kubernetes.io/on-demand"
            operator: "Equal"
            value: "true"
            effect: "PreferNoSchedule"

  # Test case for optional initContainers
  - it: should set initContainers if provided
    set:
      deployment.enabled: true
      deployment.initContainers:
        - name: init-mydb
          image: busybox:1.28
          command: ['sh', '-c', "until nslookup mydb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done"]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-mydb
            image: busybox:1.28
            command: ['sh', '-c', "until nslookup mydb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done"]

  - it: should create ExternalSecret variable with envFrom
    set:
      deployment:
        enabled: true
      externalSecret:
        enabled: true
        secrets:
          name2:
            dataFrom:
              key: postgres
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: example-app-name2

  - it: should create ExternalSecret variable with env
    set:
      deployment:
        enabled: true
      externalSecret:
        enabled: true
        secrets:
          name1:
            data:
              secretKey:
                envName: NAME_1
                remoteRef:
                  key: key1
                  property: property1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAME_1
            valueFrom:
              secretKeyRef:
                name: example-app-name1
                key: secretKey

  - it: should create ExternalSecret variable with default variable key
    set:
      deployment:
        enabled: true
      externalSecret:
        enabled: true
        secrets:
          name1:
            data:
              secretKey:
                remoteRef:
                  key: key1
                  property: property1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: secretKey
            valueFrom:
              secretKeyRef:
                name: example-app-name1
                key: secretKey

  - it: sets enableServiceLinks to false when configured
    set:
      deployment:
        enabled: true
        enableServiceLinks: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: sets enableServiceLinks to true when explicitly configured
    set:
      deployment:
        enabled: true
        enableServiceLinks: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true

  - it: does not set enableServiceLinks when not configured (defaults to true)
    set:
      deployment:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true

  - it: should NOT include any suffix in pod template app.kubernetes.io/name label
    set:
      deployment:
        enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: example-app

  - it: should support per-resource image repository override with inherited registry and tag
    set:
      appName: example-app
      image:
        registry: myregistry.io
        repository: default-repo
        tag: v2.0.0
      deployment:
        enabled: true
        image:
          repository: api-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myregistry.io/api-service:v2.0.0

  - it: should inherit all image fields when no deployment-level override is provided
    set:
      appName: example-app
      image:
        registry: gcr.io
        repository: my-project/app
        tag: latest
      deployment:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: gcr.io/my-project/app:latest

  - it: should support per-resource image override with all fields specified
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: default-repo
        tag: v1.0.0
      deployment:
        enabled: true
        image:
          registry: quay.io
          repository: my-org/service
          tag: v3.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/my-org/service:v3.0.0

  - it: should use appVersion as tag fallback when deployment image has no tag
    set:
      appName: example-app
      appVersion: 1.5.0
      image:
        registry: docker.io
        repository: default-repo
        tag: ""
      deployment:
        enabled: true
        image:
          repository: backend-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/backend-service:1.5.0

  - it: should fallback to chart version when appVersion and image tag are unset
    set:
      appName: example-app
      appVersion: ""
      image:
        registry: docker.io
        repository: default-repo
        tag: ""
      deployment:
        enabled: true
        image:
          repository: frontend-service
    asserts:
      # Asserts a semver-like tag rather than the literal Chart.yaml version so that
      # routine chart-version bumps do not red-line this test.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/frontend-service:[0-9]+\\.[0-9]+\\.[0-9]+.*$"

  - it: should use explicit tag when useChartVersionAsTagFallback is false
    set:
      appName: example-app
      appVersion: ""
      image:
        registry: docker.io
        repository: default-repo
        tag: v1.5.0
        useChartVersionAsTagFallback: false
      deployment:
        enabled: true
        image:
          repository: frontend-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/frontend-service:v1.5.0

  - it: should support string image override (backward compatibility)
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: nginx
        tag: latest
      deployment:
        enabled: true
        image: myregistry.com/custom-image:v5.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myregistry.com/custom-image:v5.0.0

  - it: should use docker.io when registry is missing
    set:
      appName: example-app
      image:
        registry: ""
        repository: my-app
        tag: v1.2.3
      deployment:
        enabled: true
        image:
          repository: custom-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/custom-service:v1.2.3

  - it: should use appVersion when useChartVersionAsTagFallback is quoted false (string form)
    set:
      appName: example-app
      appVersion: 2.5.0
      image:
        registry: docker.io
        repository: default-repo
        tag: ""
        useChartVersionAsTagFallback: "false"
      deployment:
        enabled: true
        image:
          repository: frontend-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/frontend-service:2.5.0

  - it: should use appVersion when useChartVersionAsTagFallback is quoted false but appVersion is set
    set:
      appName: example-app
      appVersion: 2.0.0
      image:
        registry: docker.io
        repository: default-repo
        tag: ""
        useChartVersionAsTagFallback: "false"
      deployment:
        enabled: true
        image:
          repository: frontend-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/frontend-service:2.0.0

  - it: should fail when useChartVersionAsTagFallback is an integer (unsupported type)
    set:
      appName: example-app
      appVersion: ""
      image:
        registry: docker.io
        repository: default-repo
        tag: ""
        useChartVersionAsTagFallback: 1
      deployment:
        enabled: true
        image:
          repository: frontend-service
    asserts:
      - failedTemplate:
          errorPattern: "image.useChartVersionAsTagFallback must be a bool or string \\('true'/'false'\\), got float64 \\(value: 1\\)"

  - it: should fail when image.registry is an integer (unsupported type)
    set:
      appName: example-app
      image:
        registry: 123
        repository: my-app
        tag: v1.0.0
      deployment:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "image.registry must be a string, got float64 \\(value: 123\\)"

  - it: should fail when image.repository is an integer (unsupported type)
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: 123
        tag: v1.0.0
      deployment:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "image.repository must be a string, got float64 \\(value: 123\\)"

  - it: should fail when image.tag is a non-string scalar (silent-coercion guard)
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: my-app
        tag: 0
      deployment:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "image.tag \\(top-level\\) is a falsey non-string value which would be silently treated as unset; got float64 \\(value: 0\\)"

  - it: should fail when image.tag is a bool (silent-coercion guard)
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: my-app
        tag: false
      deployment:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "image.tag \\(top-level\\) is a falsey non-string value which would be silently treated as unset; got bool \\(value: false\\)"

  - it: should fail when per-resource image.tag is a non-string scalar
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: my-app
        tag: "v1.0.0"
      deployment:
        enabled: true
        image:
          repository: override-app
          tag: 0
    asserts:
      - failedTemplate:
          errorPattern: "image.tag \\(resource\\) is a falsey non-string value which would be silently treated as unset; got float64 \\(value: 0\\)"

  - it: should accept truthy non-string tag (unquoted YAML number) via toString coercion
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: my-app
        tag: 5.6
      deployment:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/my-app:5.6"

  - it: should fail when top-level image.tag is a list (would render as malformed image reference)
    set:
      appName: example-app
      image:
        registry: docker.io
        repository: my-app
        tag: ["v1"]
      deployment:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "image.tag \\(top-level\\) must be a string or numeric scalar, got slice"

  - it: should fail when top-level image.tag is a map (would render as malformed image reference)
    set:
      appName: example-app
      image:
        registry: docker.io
