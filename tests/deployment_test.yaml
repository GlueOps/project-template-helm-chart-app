      - failedTemplate:
          errorPattern: "deployment\\.imagePullSecrets must not contain whitespace"

  - it: should trim surrounding whitespace from a valid secret name
    set:
      image:
        pullSecrets: "  real-cred  "
      deployment:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
