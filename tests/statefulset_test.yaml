suite: StatefulSet
templates:
  - templates/statefulset.yaml
set:
  appName: "example-app"
tests:
  - it: should use the correct image
    set:
      deployment.enabled: false
      statefulSet.enabled: true
      image.registry: docker.io
      image.repository: nginx
      image.tag: 1.0.0
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker.io/nginx:1.0.0$'
  - it: should use the correct port
    set:
      image.port: 9999
      statefulSet.enabled: true
      deployment.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9999

  - it: should include the correct commonAnnotations
    set:
      commonAnnotations:
        anno: test
      statefulSet.enabled: true
      deployment.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.annotations.anno
          value: test
  - it: should include the correct commonLabels
    set:
      commonLabels:
        lbl: test
      statefulSet.enabled: true
      deployment.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.labels.lbl
          value: test

  - it: sets enableServiceLinks to false when configured
    set:
      deployment.enabled: false
      statefulSet:
        enabled: true
        enableServiceLinks: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: defaults enableServiceLinks to true when not configured
    set:
      deployment.enabled: false
      statefulSet:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true

  - it: should support per-statefulset image repository override with inherited registry and tag
    set:
      deployment.enabled: false
      appName: example-app
      image:
        registry: ghcr.io
        repository: shared-repo
        tag: v4.1.0
      statefulSet:
        enabled: true
        image:
          repository: data-service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/data-service:v4.1.0

  - it: should support statefulset image string override for backward compatibility
    set:
      deployment.enabled: false
      appName: example-app
      image:
        registry: docker.io
        repository: nginx
        tag: latest
      statefulSet:
        enabled: true
        image: quay.io/example/stateful:v9.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/example/stateful:v9.0.0


  - it: should inherit image.pullSecrets (documented key) on statefulset pods
    set:
      image:
        pullSecrets: global-reg-cred
      statefulSet:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: global-reg-cred

  - it: should prefer statefulSet.imagePullSecrets over image.pullSecrets
    set:
      image:
        pullSecrets: global-reg-cred
      statefulSet:
        enabled: true
        imagePullSecrets: sts-cred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: sts-cred

  - it: should opt out of image.pullSecrets when statefulSet.imagePullSecrets is empty string
    set:
      image:
        pullSecrets: global-reg-cred
      statefulSet:
        enabled: true
        imagePullSecrets: ""
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets

  - it: should inherit image.pullSecrets when statefulSet.imagePullSecrets is null
    set:
      image:
        pullSecrets: global-reg-cred
      statefulSet:
        enabled: true
        imagePullSecrets: null
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: global-reg-cred

  - it: should render no imagePullSecrets on statefulset when none are set
    set:
      statefulSet:
        enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets

  - it: should fail when statefulSet.imagePullSecrets is not a string
    set:
      statefulSet:
        enabled: true
        imagePullSecrets: false
    asserts:
      - failedTemplate:
          errorPattern: "statefulSet\\.imagePullSecrets must be a string secret name"

  # helm.sh/chart on the pod template (canonical tests in deployment_test.yaml)
  - it: keeps helm.sh/chart on StatefulSet metadata but not on the pod template
    set:
      statefulSet:
        enabled: true
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.annotations["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.annotations["helm.sh/chart"]
      - equal:
          path: spec.template.metadata.annotations
          value:
            glueops.dev/chart: app

  # glueops.dev/chart is pod-template only; top-level metadata keeps helm.sh/chart.
  - it: does not put glueops.dev/chart on StatefulSet metadata
    chart:
      version: 1.0.0
    set:
      commonAnnotations:
        anno: test
      statefulSet:
        enabled: true
    asserts:
      - notExists:
          path: metadata.annotations["glueops.dev/chart"]
      - notExists:
          path: metadata.labels["glueops.dev/chart"]
      - equal:
          path: metadata.annotations
          value:
            helm.sh/chart: app-1.0.0
            anno: test

  - it: renders glueops.dev/chart, commonAnnotations and statefulSet.annotations together on the pod template
    set:
      commonAnnotations:
        anno: test
      statefulSet:
        enabled: true
        annotations:
          prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            glueops.dev/chart: app
            anno: test
            prometheus.io/scrape: "true"

  # Regression: same exact pod template metadata under two chart versions.
  - it: pod template metadata is chart-version independent (0.0.1)
    chart:
      version: 0.0.1
    set:
      appVersion: "1.2.3"
      commonLabels:
        lbl: test
      commonAnnotations:
        anno: test
      statefulSet:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: app-0.0.1
      - equal:
          path: spec.template.metadata
          value:
            labels:
              app.kubernetes.io/name: example-app
              app.kubernetes.io/version: "1.2.3"
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/managed-by: Helm
              lbl: test
            annotations:
              glueops.dev/chart: app
              anno: test
      - notMatchRegex:
          path: spec.template.metadata.annotations["glueops.dev/chart"]
          pattern: "[0-9]"

  - it: pod template metadata is chart-version independent (99.0.0)
    chart:
      version: 99.0.0
    set:
      appVersion: "1.2.3"
      commonLabels:
        lbl: test
      commonAnnotations:
        anno: test
      statefulSet:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: app-99.0.0
      - equal:
          path: spec.template.metadata
          value:
            labels:
              app.kubernetes.io/name: example-app
              app.kubernetes.io/version: "1.2.3"
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/managed-by: Helm
              lbl: test
            annotations:
              glueops.dev/chart: app
              anno: test
      - notMatchRegex:
          path: spec.template.metadata.annotations["glueops.dev/chart"]
          pattern: "[0-9]"
