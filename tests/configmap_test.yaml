suite: Configmap

templates:
  - templates/configmap.yaml
set:
  appName: "example-app"

tests:
  - it: should not create configmap when disabled
    set:
    asserts:
      - hasDocuments:
          count: 0

  - it: should create configmap
    set:
      configMap:
        enabled: true
        configs:
          config1:
            data: |-
              key1: value1
              key2: value2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: "example-app-config1"
      - equal:
          path: .data.key1
          value: "value1"
      - equal:
          path: .data.key2
          value: "value2"

  - it: should create configmap from dataMap
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap:
              LOG_LEVEL: info
              API_PORT: 8080
              DEBUG: true
              EMPTY: ""
              braces.conf: "value with {{ literal braces }}"
              .env: |
                FOO=BAR
                APP=test
              script.sh: |-
                #!/bin/sh
                echo "no trailing newline"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "example-app-config1"
      - equal:
          path: .data.LOG_LEVEL
          value: "info"
      - equal:
          path: .data["API_PORT"]
          value: "8080"
      - equal:
          path: .data.DEBUG
          value: "true"
      - equal:
          path: .data.EMPTY
          value: ""
      - equal:
          path: .data["braces.conf"]
          value: "value with {{ literal braces }}"
      - equal:
          path: .data[".env"]
          value: "FOO=BAR\nAPP=test\n"
      - equal:
          path: .data["script.sh"]
          value: "#!/bin/sh\necho \"no trailing newline\""

  - it: should omit dataMap keys set to null
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap:
              LOG_LEVEL: debug
              REMOVE_ME: null
    asserts:
      - equal:
          path: .data.LOG_LEVEL
          value: "debug"
      - isNull:
          path: .data.REMOVE_ME

  - it: should fail when both data and dataMap are set
    set:
      configMap:
        enabled: true
        configs:
          config1:
            data: |-
              key1: value1
            dataMap:
              key2: value2
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: set either 'data' or 'dataMap', not both"

  - it: should fail when neither data nor dataMap is set
    set:
      configMap:
        enabled: true
        configs:
          config1: {}
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: must set 'data' or 'dataMap'"

  - it: should quote dataMap keys so YAML 1.1 boolean-like keys survive
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap:
              "no": "norwegian-locale"
              "on": "toggle-file"
              "123": "numeric-name"
    asserts:
      - equal:
          path: .data["no"]
          value: "norwegian-locale"
      - equal:
          path: .data["on"]
          value: "toggle-file"
      - equal:
          path: .data["123"]
          value: "numeric-name"

  - it: should fail when a dataMap value is a nested map
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap:
              settings:
                nested: true
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: dataMap key 'settings' must have a scalar value \\(string/number/bool\\), got map"

  - it: should fail when a dataMap value is a list
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap:
              items:
                - a
                - b
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: dataMap key 'items' must have a scalar value \\(string/number/bool\\), got slice"

  - it: should fail when dataMap is not a map
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap: "oops"
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: 'dataMap' must be a map of key/value pairs, got string"

  - it: should fail with actionable error when data is a map
    set:
      configMap:
        enabled: true
        configs:
          config1:
            data:
              key1: value1
    asserts:
      - failedTemplate:
          errorPattern: "configMap.configs.config1: 'data' must be a string, got map - use 'dataMap' for key/value maps"

  - it: should render empty configmap when data is an empty string
    set:
      configMap:
        enabled: true
        configs:
          config1:
            data: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isNullOrEmpty:
          path: .data

  - it: should render empty configmap when dataMap is an empty map
    set:
      configMap:
        enabled: true
        configs:
          config1:
            dataMap: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isNullOrEmpty:
          path: .data