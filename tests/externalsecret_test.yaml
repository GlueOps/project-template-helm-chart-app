suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
set:
  appName: "example-app"

tests:
  - it: should create an ExternalSecret
    set:
      externalSecret:
        enabled: true
        secrets:
          name1:
            data:
              secretKey:
                remoteRef:
                  key: key1
                  property: property1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name1"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key1"
      - equal:
          path: spec.data[0].secretKey
          value: "secretKey"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property1"

  - it: should create an ExternalSecret with dataFrom
    set:
      externalSecret:
        enabled: true
        secrets:
          name2:
            dataFrom:
              key: postgres
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name2"
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "postgres"

  - it: should render all configured remoteRef fields
    set:
      externalSecret:
        enabled: true
        secrets:
          name3:
            data:
              token:
                remoteRef:
                  key: key3
                  property: property3
                  version: "AWSCURRENT"
                  decodingStrategy: None
                  metadataPolicy: None
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "example-app-name3"
      - equal:
          path: spec.data[0].secretKey
          value: "token"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key3"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property3"
      - equal:
          path: spec.data[0].remoteRef.version
          value: "AWSCURRENT"
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: "None"
