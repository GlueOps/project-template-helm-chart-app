suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
set:
  appName: "example-app"

tests:
  - it: should create an ExternalSecret
    set:
      externalSecret:
        enabled: true
        secrets:
          name1:
            data:
              secretKey:
                remoteRef:
                  key: key1
                  property: property1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name1"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key1"
      - equal:
          path: spec.data[0].secretKey
          value: "secretKey"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property1"

  - it: should create an ExternalSecret with dataFrom
    set:
      externalSecret:
        enabled: true
        secrets:
          name2:
            dataFrom:
              key: postgres
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name2"
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "postgres"

  - it: should render all configured remoteRef fields
    set:
      externalSecret:
        enabled: true
        secrets:
          name3:
            data:
              token:
                remoteRef:
                  key: key3
                  property: property3
                  version: "AWSCURRENT"
                  decodingStrategy: None
                  metadataPolicy: None
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "example-app-name3"
      - equal:
          path: spec.data[0].secretKey
          value: "token"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key3"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property3"
      - equal:
          path: spec.data[0].remoteRef.version
          value: "AWSCURRENT"
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: "None"

  - it: should fail when remoteRef is missing
    set:
      externalSecret:
        enabled: true
        secrets:
          name4:
            data:
              missing-remote-ref: {}
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef is required for secretKey missing-remote-ref in secret example-app-name4"

  - it: should fail when remoteRef.key is missing
    set:
      externalSecret:
        enabled: true
        secrets:
          name5:
            data:
              missing-key:
                remoteRef:
                  property: only-property
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key is required for secretKey missing-key in secret example-app-name5"

  - it: should fail when remoteRef is not a map
    set:
      externalSecret:
        enabled: true
        secrets:
          name6:
            data:
              wrong-type:
                remoteRef: invalid-scalar
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef must be a map for secretKey wrong-type in secret example-app-name6"

  - it: should fail when remoteRef.key is not a string
    set:
      externalSecret:
        enabled: true
        secrets:
          name7:
            data:
              int-key:
                remoteRef:
                  key: 12345
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key must be a string for secretKey int-key in secret example-app-name7"

  - it: should fail when remoteRef.key is empty
    set:
      externalSecret:
        enabled: true
        secrets:
          name8:
            data:
              empty-key:
                remoteRef:
                  key: ""
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key must be non-empty for secretKey empty-key in secret example-app-name8"

  - it: should trim surrounding whitespace from remoteRef.key
    set:
      externalSecret:
        enabled: true
        secrets:
          name9:
            data:
              whitespace-key:
                remoteRef:
                  key: "  mykey  "
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: "mykey"
