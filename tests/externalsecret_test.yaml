suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
set:
  appName: "example-app"

tests:
  - it: should create an ExternalSecret
    set:
      externalSecret:
        enabled: true
        secrets:
          name1:
            data:
              secretKey:
                remoteRef:
                  key: key1
                  property: property1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name1"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key1"
      - equal:
          path: spec.data[0].secretKey
          value: "secretKey"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property1"

  - it: should create an ExternalSecret with dataFrom
    set:
      externalSecret:
        enabled: true
        secrets:
          name2:
            dataFrom:
              key: postgres
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: "example-app-name2"
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "postgres"

  - it: should render all configured remoteRef fields
    set:
      externalSecret:
        enabled: true
        secrets:
          name3:
            data:
              token:
                remoteRef:
                  key: key3
                  property: property3
                  version: "AWSCURRENT"
                  decodingStrategy: None
                  metadataPolicy: None
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "example-app-name3"
      - equal:
          path: spec.data[0].secretKey
          value: "token"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "key3"
      - equal:
          path: spec.data[0].remoteRef.property
          value: "property3"
      - equal:
          path: spec.data[0].remoteRef.version
          value: "AWSCURRENT"
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: "None"

  - it: should fail when remoteRef is missing
    set:
      externalSecret:
        enabled: true
        secrets:
          name4:
            data:
              missing-remote-ref: {}
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef is required for secretKey missing-remote-ref in secret example-app-name4"

  - it: should fail when remoteRef.key is missing
    set:
      externalSecret:
        enabled: true
        secrets:
          name5:
            data:
              missing-key:
                remoteRef:
                  property: only-property
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key is required for secretKey missing-key in secret example-app-name5"

  - it: should fail when remoteRef is not a map
    set:
      externalSecret:
        enabled: true
        secrets:
          name6:
            data:
              wrong-type:
                remoteRef: invalid-scalar
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef must be a map for secretKey wrong-type in secret example-app-name6"

  - it: should fail when remoteRef.key is not a string
    set:
      externalSecret:
        enabled: true
        secrets:
          name7:
            data:
              int-key:
                remoteRef:
                  key: 12345
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key must be a string for secretKey int-key in secret example-app-name7"

  - it: should fail when remoteRef.key is empty
    set:
      externalSecret:
        enabled: true
        secrets:
          name8:
            data:
              empty-key:
                remoteRef:
                  key: ""
    asserts:
      - failedTemplate:
          errorMessage: "remoteRef.key must be non-empty for secretKey empty-key in secret example-app-name8"

  - it: should trim surrounding whitespace from remoteRef.key
    set:
      externalSecret:
        enabled: true
        secrets:
          name9:
            data:
              whitespace-key:
                remoteRef:
                  key: "  mykey  "
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: "mykey"

  - it: should fail when data entry is a scalar instead of a map
    set:
      externalSecret:
        enabled: true
        secrets:
          name10:
            data:
              accidental-scalar: "some-string"
    asserts:
      - failedTemplate:
          errorPattern: "data entry for secretKey accidental-scalar in secret example-app-name10 must be a map, not a scalar"

  - it: should fail with interpolated secret name when neither data nor dataFrom is set
    set:
      externalSecret:
        enabled: true
        secrets:
          name11: {}
    asserts:
      - failedTemplate:
          errorPattern: "data or dataFrom not specified for secret example-app-name11"

  - it: should report remoteRef.key required (not remoteRef required) when remoteRef is an empty map
    set:
      externalSecret:
        enabled: true
        secrets:
          name12:
            data:
              empty-remote-ref:
                remoteRef: {}
    asserts:
      - failedTemplate:
          errorPattern: "remoteRef.key is required for secretKey empty-remote-ref in secret example-app-name12"

  - it: should fail when dataFrom is missing key
    set:
      externalSecret:
        enabled: true
        secrets:
          name13:
            dataFrom:
              other-field: value
    asserts:
      - failedTemplate:
          errorPattern: "dataFrom.key is required for secret example-app-name13"

  - it: should fail when dataFrom.key is not a string
    set:
      externalSecret:
        enabled: true
        secrets:
          name14:
            dataFrom:
              key: 123
    asserts:
      - failedTemplate:
          errorPattern: "dataFrom.key must be a string for secret example-app-name14"

  - it: should fail when dataFrom.key is empty
    set:
      externalSecret:
        enabled: true
        secrets:
          name15:
            dataFrom:
              key: "   "
    asserts:
      - failedTemplate:
          errorPattern: "dataFrom.key must be non-empty for secret example-app-name15"

  - it: should fail when dataFrom is a scalar instead of a map
    set:
      externalSecret:
        enabled: true
        secrets:
          name16:
            dataFrom: "scalar-value"
    asserts:
      - failedTemplate:
          errorPattern: "dataFrom must be a map for secret example-app-name16, got string"

  - it: should trim whitespace around dataFrom.key
    set:
      externalSecret:
        enabled: true
        secrets:
          name17:
            dataFrom:
              key: "  trimmed-key  "
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "trimmed-key"

  - it: should report dataFrom.key required (not generic neither-set) when dataFrom is an empty map
    set:
      externalSecret:
        enabled: true
        secrets:
          name18:
            dataFrom: {}
    asserts:
      - failedTemplate:
          errorPattern: "dataFrom.key is required for secret example-app-name18"

  - it: should report data.* required (not generic neither-set) when data is an empty map
    set:
      externalSecret:
        enabled: true
        secrets:
          name19:
            data: {}
    asserts:
      - failedTemplate:
          errorPattern: "data must contain at least one entry for secret example-app-name19"

  - it: should fail when data is a list instead of a map
    set:
      externalSecret:
        enabled: true
        secrets:
          name20:
            data:
              - foo
    asserts:
      - failedTemplate:
          errorPattern: "data must be a map for secret example-app-name20, got slice"

  - it: should pass-through extra fields under dataFrom.extract (mirrors remoteRef pass-through)
    set:
      externalSecret:
        enabled: true
        secrets:
          name21:
            dataFrom:
              key: mongodb
              property: password
              version: AWSCURRENT
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: "mongodb"
      - equal:
          path: spec.dataFrom[0].extract.property
          value: "password"
      - equal:
          path: spec.dataFrom[0].extract.version
          value: "AWSCURRENT"
