podDisruptionBudget:
  enabled: true
deployment:
  enabled: true
  replicas: 2
  maxUnavailable: 25%
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi
  livenessProbe:
    httpGet:
      path: /livez
      port: 8080
  readinessProbe:
    exec:
      command:
      - cat
      - /tmp/healthy
  startupProbe:
    tcpSocket:
      port: 8080
ingress:
  enabled: true
  annotations:
    # NOTE: the deprecated `kubernetes.io/ingress.class` annotation is deliberately
    # not set here. The API server rejects an Ingress that carries both it and a
    # `spec.ingressClassName` that does not match it, so use one or the other --
    # `ingressClassName` is the supported field.
    ingress.kubernetes.io/rewrite-target: /
    ingress.kubernetes.io/force-ssl-redirect: "true"
  # Default class and TLS for every entry that does not set its own
  ingressClassName: nginx
  tls:
    - hosts:
        - chart-example.local
        - '{{ .Chart.Name }}.example.com'
      # Secrets must be created in the same namespace
      secretName: chart-example-tls
  entries:
    # Inherits ingressClassName: nginx and the top-level tls
    - name: external
      labels:
      annotations:
      hosts:
        - hostname: service1.example.com
          paths:
            - path: /*
              serviceName: ssl-redirect
              servicePortName: use-annotation
            - path: /metrics
              # pathType:
              # serviceName:
              # servicePortNumber:
    # Same routes through Traefik, with its own class and TLS secret
    - name: external-traefik
      ingressClassName: traefik
      hosts:
        - hostname: service1-traefik.example.com
          paths:
            - path: /metrics
      tls:
        - hosts:
            - service1-traefik.example.com
          secretName: chart-example-traefik-tls
