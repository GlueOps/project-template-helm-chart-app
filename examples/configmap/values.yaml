configMap:
  enabled: true
  labels: 
    key: value
  annotations: 
    key: value
  configs:
    # nameSuffix of configMap
    configmap1:
      data: |-
        API_PORT: "8080"
        LOG_LEVEL: info
        .env: |
          FOO=BAR
          APP=test
        example.json: |
          {
            "test": "123"
          }
    configmap2:
      data: |-
        example.yaml: |
          "test": "123"
    # dataMap keys merge individually across layered values files
    # (base-values.yaml + env values.yaml); prefer it for per-environment overrides
    configmap3:
      dataMap:
        API_PORT: "8080"
        LOG_LEVEL: info
        DEBUG: "true"
        braces.conf: "rendered literally, no tpl: {{ .Values.appName }}"
        .env: |
          FOO=BAR
          APP=test
        # key-quoting canary: test.sh greps the raw render for this quoted key;
        # an unquoted `on` key would be coerced to "true" by the YAML 1.1 parsers
        # in Helm and Kubernetes
        "on": "quoted-key-canary"
        # html-escape canary: test.sh greps the raw render for the literal `A & B <div`;
        # an HTML-escaping regression (toJson instead of toRawJson) would emit
        # & and < instead, invisible to helm-unittest which un-escapes on parse
        html.txt: "A & B <div class='x'>ok</div>"
